<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16213a">
<title>Regen Design Requests</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#18202f; --muted:#667085; --line:#e3e6ec;
  --navy:#16213a; --accent:#f59e0b; --accent-ink:#1b1300;
  --red:#d92d20; --red-bg:#fee4e2; --orange:#e8590c; --orange-bg:#ffead5;
  --amber:#b54708; --amber-bg:#fef0c7; --green:#067647; --green-bg:#dcfae6;
  --blue:#175cd3; --blue-bg:#d1e9ff; --grey-bg:#eef0f3;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.bar{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{display:block;opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:grid;place-items:center}
.icon-btn:active{background:rgba(255,255,255,.2)}
main{max-width:960px;margin:0 auto;padding:14px 16px 110px}
.alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.alert{border:0;border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;background:var(--card);box-shadow:var(--shadow)}
.alert b{display:block;font-size:22px;line-height:1.1}
.alert span{font-size:12px;color:var(--muted)}
.alert.red b{color:var(--red)} .alert.orange b{color:var(--orange)} .alert.amber b{color:var(--amber)} .alert.grey b{color:var(--ink)}
.alert.on{outline:2px solid var(--navy)}
.alert.zero{opacity:.55}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.search{flex:1 1 220px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.list{display:grid;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 12px 16px;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.card.u-overdue::before{background:var(--red)} .card.u-urgent::before{background:var(--orange)} .card.u-soon::before{background:var(--accent)} .card.u-done::before{background:var(--green)}
.row1{display:flex;align-items:flex-start;gap:8px}
.row1 .t{flex:1;min-width:0}
.id{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.client{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--grey-bg);white-space:nowrap}
.p-Urgent{background:var(--red-bg);color:var(--red);font-weight:600}
.p-High{background:var(--orange-bg);color:var(--orange);font-weight:600}
.p-Normal{background:var(--blue-bg);color:var(--blue)}
.p-Low{background:var(--grey-bg);color:var(--muted)}
.s-Completed{background:var(--green-bg);color:var(--green)} .s-Info{background:var(--amber-bg);color:var(--amber)}
.s-Review{background:#ebe9fe;color:#5925dc} .s-Cancelled,.s-Hold{background:var(--grey-bg);color:var(--muted)}
.due{font-size:13px;font-weight:600;white-space:nowrap;text-align:right}
.due small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.due.overdue{color:var(--red)} .due.urgent{color:var(--orange)} .due.soon{color:var(--amber)}
.who{font-size:13px;color:var(--muted)}
.who.none{color:var(--red);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;z-index:4}
footer{max-width:960px;margin:0 auto;padding:0 16px 90px;font-size:11px;color:var(--muted);text-align:center}
/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 2px;font-size:19px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.close{float:right;border:0;background:var(--grey-bg);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--grey-bg);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{margin:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);font-size:14px;cursor:pointer}
.checks input{margin:0}
.checks label:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
.checks label:has(input:disabled){cursor:default}
.prio{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prio label{margin:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;color:var(--ink);cursor:pointer;font-size:14px}
.prio input{display:none}
.prio label:has(input:checked){border-color:currentColor;font-weight:700}
.prio .Urgent:has(input:checked){background:var(--red-bg);color:var(--red)}
.prio .High:has(input:checked){background:var(--orange-bg);color:var(--orange)}
.prio .Normal:has(input:checked){background:var(--blue-bg);color:var(--blue)}
.prio .Low:has(input:checked){background:var(--grey-bg)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn.alt{background:var(--grey-bg);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.section{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.section h3{font-size:14px;margin:12px 0 0;color:var(--navy)}
.lock{font-size:12px;color:var(--muted);margin-top:4px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner.overdue{background:var(--red-bg);color:var(--red)} .banner.urgent{background:var(--orange-bg);color:var(--orange)} .banner.soon{background:var(--amber-bg);color:var(--amber)}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.log li{padding:7px 0;border-bottom:1px dashed var(--line)}
.log b{font-weight:600}
.log time{color:var(--muted);font-size:12px;display:block}
.comment{display:flex;gap:8px;margin-top:10px}
.comment input{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
/* login */
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.login .box{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px}
.login h1{font-size:22px;margin:12px 0 4px}
.login p{color:var(--muted);margin:0 0 6px;font-size:14px}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-size:14px;text-decoration:underline}
.demo-tag{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.rep-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.rep-stats div{background:var(--grey-bg);border-radius:10px;padding:8px 4px;text-align:center}
.rep-stats b{display:block;font-size:18px;line-height:1.2}
.rep-stats span{font-size:11px;color:var(--muted)}
.brand b{white-space:nowrap}
@media(max-width:520px){.alerts{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}
  .toolbar{flex-direction:column-reverse}.search{flex:none;width:100%}.chips{flex:none;width:100%}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="loginView" class="login hidden">
  <div class="box">
    <img src="icon-192.png" alt="" width="52" height="52" style="border-radius:14px;display:block">
    <h1>Design Requests</h1>
    <p>Regen Renewables — Sales ↔ Design job tracker</p>
    <div id="setupBox" class="hidden">
      <label for="apiInput">Server link (Apps Script web app /exec URL)</label>
      <input id="apiInput" type="text" placeholder="https://script.google.com/macros/s/…/exec">
      <div class="actions"><button class="btn" id="saveApi">Connect</button></div>
    </div>
    <div id="signinBox">
      <label for="nameSel">Your name</label>
      <select id="nameSel"><option value="">Loading team…</option></select>
      <label for="keyInput">Team key</label>
      <input id="keyInput" type="password" autocomplete="current-password" placeholder="Key from the Design Lead">
      <div class="actions"><button class="btn" id="signinBtn">Sign in</button></div>
    </div>
    <p style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap">
      <button class="link" id="demoBtn">Try demo (sample data)</button>
      <button class="link" id="changeApi">Change server</button>
    </p>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="appView" class="hidden">
  <header>
    <div class="bar">
      <div class="brand">
        <img src="icon-192.png" alt="" width="34" height="34" style="border-radius:9px;display:block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)">
        <div style="min-width:0"><b>Design Requests<span id="demoTag" class="demo-tag hidden">DEMO</span></b><small id="whoami"></small></div>
      </div>
      <button class="icon-btn" id="reportBtn" title="Report" aria-label="Download report"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6"/><path d="M9.5 14.5 12 17l2.5-2.5"/></svg></button>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button>
      <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg></button>
    </div>
  </header>
  <main>
    <div class="alerts" id="alerts"></div>
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <input class="search" id="search" type="text" placeholder="Search client, ID, location…">
    </div>
    <div class="list" id="list"></div>
  </main>
  <footer>© <span id="yr"></span> Regen Renewables (Pvt) Ltd. Confidential — for internal use only. Unauthorised copying or distribution is prohibited.</footer>
  <button class="fab hidden" id="newBtn">＋ New request</button>
</div>

<div id="modal" class="scrim hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   CONFIG — paste your Apps Script web app URL here once,
   or leave blank and enter it on the sign-in screen.
   ========================================================= */
const API_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbxAG405fXcTWJ5P-cpJVWwVbA1C8C74f05_-anyq8G8QyZSKftHdd9VqM8qwAIbqCazog/exec';

const DELIVERABLES = ['Roof layout', 'SLD', 'Structure', 'BOQ', 'Proposal', 'Yield report'];
const PROJECT_TYPES = ['Domestic on-grid', 'Domestic hybrid', 'Commercial', 'Industrial', 'Ground mount', 'Other'];
const PRIORITIES = ['Urgent', 'High', 'Normal', 'Low'];
const STATUSES = ['New', 'Assigned', 'In Progress', 'Info Needed', 'Review', 'Completed', 'On Hold', 'Cancelled'];
const CLOSED = ['Completed', 'Cancelled'];
const SOON_H = 48, URGENT_H = 24;
const LS = 'regen-drt-v1';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch(e){ return {}; } },
  set(p){ try { localStorage.setItem(LS, JSON.stringify(Object.assign(store.get(), p))); } catch(e){} }
};

const S = { user:null, key:'', demo:false, api:'', requests:[], team:[], filter:'active', quick:'', q:'', open:null, busy:false };

/* ---------------- API ---------------- */
async function api(action, data = {}){
  if (S.demo) return Demo.call(action, data, S.user);
  if (!S.api) throw new Error('Server link not set');
  const res = await fetch(S.api, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({ action, auth:{ name:S.user?.name || data._name, key:S.key || data._key } }, data)) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j.data;
}

/* ---------------- urgency ---------------- */
function urgency(r, now = Date.now()){
  if (r.Status === 'Completed') return 'done';
  if (CLOSED.includes(r.Status) || r.Status === 'On Hold') return 'idle';
  const h = (new Date(r.Deadline) - now) / 36e5;
  if (h < 0) return 'overdue';
  if (h <= URGENT_H) return 'urgent';
  if (h <= SOON_H) return 'soon';
  return 'ok';
}
function relDue(r){
  const ms = new Date(r.Deadline) - Date.now();
  const a = Math.abs(ms), d = Math.floor(a / 864e5), h = Math.floor(a % 864e5 / 36e5), m = Math.floor(a % 36e5 / 6e4);
  const span = d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
  return ms < 0 ? `Overdue ${span}` : `Due in ${span}`;
}
const fmtDate = iso => iso ? new Date(iso).toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true }) : '';
const toLocalInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const prioRank = { Urgent:0, High:1, Normal:2, Low:3 };
const urgRank = { overdue:0, urgent:1, soon:2, ok:3, idle:4, done:5 };

/* ---------------- boot / login ---------------- */
async function boot(){
  $('#yr').textContent = new Date().getFullYear();
  const st = store.get();
  S.api = st.api || API_URL_DEFAULT;
  if (st.demo) { startDemo(st.user); return; }
  if (st.user && st.key && S.api) {
    S.user = st.user; S.key = st.key;
    showApp(); await refresh(true);
    return;
  }
  showLogin();
}

function showLogin(){
  $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden');
  const noApi = !S.api;
  $('#setupBox').classList.toggle('hidden', !noApi);
  $('#signinBox').classList.toggle('hidden', noApi);
  if (!noApi) loadTeam();
}

async function loadTeam(){
  const sel = $('#nameSel');
  sel.innerHTML = '<option value="">Loading team…</option>';
  try {
    const res = await fetch(S.api, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'team' }) });
    const j = await res.json(); if (!j.ok) throw new Error(j.error);
    fillNames(j.data);
  } catch(e){ sel.innerHTML = '<option value="">Could not reach server</option>'; toast('Could not reach the server — check the link', true); }
}
function fillNames(team){
  const grp = t => team.filter(m => m.team.toLowerCase() === t);
  const opt = m => `<option value="${esc(m.name)}">${esc(m.name)}${m.lead ? ' (Lead)' : ''}</option>`;
  $('#nameSel').innerHTML = '<option value="">Select your name</option>' +
    `<optgroup label="Sales">${grp('sales').map(opt).join('')}</optgroup><optgroup label="Design">${grp('design').map(opt).join('')}</optgroup>`;
  const last = store.get().lastName; if (last) $('#nameSel').value = last;
}

$('#saveApi').onclick = () => {
  const v = $('#apiInput').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)) return toast('Paste the web app link that ends with /exec', true);
  S.api = v; store.set({ api:v }); showLogin();
};
$('#changeApi').onclick = () => { $('#apiInput').value = S.api; $('#setupBox').classList.remove('hidden'); $('#signinBox').classList.add('hidden'); };
$('#signinBtn').onclick = async () => {
  const name = $('#nameSel').value, key = $('#keyInput').value.trim();
  if (!name || !key) return toast('Select your name and enter the team key', true);
  const b = $('#signinBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const u = await api('login', { _name:name, _key:key });
    S.user = u; S.key = key; store.set({ user:u, key, lastName:name, demo:false });
    showApp(); await refresh(true);
  } catch(e){ toast(e.message, true); }
  finally { b.disabled = false; b.textContent = 'Sign in'; }
};
$('#keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#signinBtn').click(); });
$('#demoBtn').onclick = () => pickDemoUser();
$('#logoutBtn').onclick = () => { store.set({ user:null, key:'', demo:false }); S.user = null; S.key = ''; S.demo = false; S.requests = []; showLogin(); };
$('#refreshBtn').onclick = () => refresh(true);
$('#reportBtn').onclick = () => openReport();

function showApp(){
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  const roleName = { sales:'Sales', lead:'Design Lead', designer:'Designer' }[S.user.role];
  $('#whoami').textContent = `${S.user.name} · ${roleName}`;
  $('#demoTag').classList.toggle('hidden', !S.demo);
  $('#newBtn').classList.toggle('hidden', !(S.user.role === 'sales' || S.user.role === 'lead'));
  S.filter = S.user.role === 'designer' ? 'mine' : 'active';
  renderChips();
}

/* ---------------- data ---------------- */
async function refresh(manual){
  if (S.busy) return; S.busy = true;
  if (manual) $('#refreshBtn').innerHTML = '<span class="spin"></span>';
  try {
    const d = await api('list');
    S.requests = d.requests; S.team = d.team;
    render();
  } catch(e){
    if (/team key|not found in the team/i.test(e.message)) { toast(e.message + ' — please sign in again', true); $('#logoutBtn').click(); }
    else if (manual) toast(e.message, true);
  } finally { S.busy = false; $('#refreshBtn').textContent = '↻'; }
}
setInterval(() => { if (S.user && document.visibilityState === 'visible') refresh(false); }, 60000);
document.addEventListener('visibilitychange', () => { if (S.user && document.visibilityState === 'visible') refresh(false); });
setInterval(() => { if (S.user) render(); }, 60000); // keep "due in" times fresh

/* ---------------- list view ---------------- */
const FILTERS = {
  active:   { label:'All open',    fn: r => !CLOSED.includes(r.Status) },
  mine:     { label:'My jobs',     fn: r => !CLOSED.includes(r.Status) && (S.user.role === 'sales' ? r.CreatedBy === S.user.name : r.AssignedTo === S.user.name) },
  unassigned:{label:'Unassigned',  fn: r => !CLOSED.includes(r.Status) && !r.AssignedTo },
  info:     { label:'Info needed', fn: r => r.Status === 'Info Needed' },
  review:   { label:'Review',      fn: r => r.Status === 'Review' },
  done:     { label:'Completed',   fn: r => r.Status === 'Completed' },
  all:      { label:'All',         fn: () => true }
};
function renderChips(){
  const keys = S.user.role === 'lead' ? ['active','mine','unassigned','review','info','done','all']
            : S.user.role === 'sales' ? ['active','mine','info','done','all'] : ['mine','active','info','done','all'];
  $('#chips').innerHTML = keys.map(k => `<button class="chip ${S.filter === k ? 'on' : ''}" data-f="${k}">${FILTERS[k].label}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { S.filter = b.dataset.f; S.quick = ''; renderChips(); render(); });
}
$('#search').addEventListener('input', e => { S.q = e.target.value.trim().toLowerCase(); render(); });

function render(){
  if (!S.user) return;
  const now = Date.now();
  const open = S.requests.filter(r => !CLOSED.includes(r.Status) && r.Status !== 'On Hold');
  const cnt = { overdue:0, urgent:0, soon:0 };
  open.forEach(r => { const u = urgency(r, now); if (cnt[u] !== undefined) cnt[u]++; });
  const unassigned = open.filter(r => !r.AssignedTo).length;
  const tiles = [
    ['overdue','red',cnt.overdue,'Overdue'], ['urgent','orange',cnt.urgent,'Due ≤ 24h'],
    ['soon','amber',cnt.soon,'Due ≤ 48h'], ['unassigned','grey',unassigned,'Unassigned']
  ];
  $('#alerts').innerHTML = tiles.map(([k,c,n,l]) => `<button class="alert ${c} ${n ? '' : 'zero'} ${S.quick === k ? 'on' : ''}" data-q="${k}"><b>${n}</b><span>${l}</span></button>`).join('');
  $('#alerts').querySelectorAll('.alert').forEach(b => b.onclick = () => { S.quick = S.quick === b.dataset.q ? '' : b.dataset.q; render(); });

  let rows = S.requests.filter(S.quick ? (r => {
      if (CLOSED.includes(r.Status) || r.Status === 'On Hold') return false;
      return S.quick === 'unassigned' ? !r.AssignedTo : urgency(r, now) === S.quick;
    }) : FILTERS[S.filter].fn);
  if (S.q) rows = rows.filter(r => [r.ID, r.Client, r.Location, r.AssignedTo, r.CreatedBy, r.Deliverables, r.Status].join(' ').toLowerCase().includes(S.q));
  rows.sort((a, b) => {
    if (S.filter === 'done' && !S.quick) return new Date(b.CompletedAt || b.UpdatedAt) - new Date(a.CompletedAt || a.UpdatedAt);
    return urgRank[urgency(a, now)] - urgRank[urgency(b, now)] || new Date(a.Deadline) - new Date(b.Deadline) || prioRank[a.Priority] - prioRank[b.Priority];
  });

  $('#list').innerHTML = rows.length ? rows.map(r => {
    const u = urgency(r, now);
    const st = r.Status === 'Info Needed' ? 'Info' : r.Status === 'On Hold' ? 'Hold' : r.Status;
    const due = ['overdue','urgent','soon','ok'].includes(u) ? relDue(r) : r.Status === 'Completed' ? 'Done' : r.Status;
    return `<div class="card u-${u}" data-id="${esc(r.ID)}" tabindex="0">
      <div class="row1">
        <div class="t"><div class="id">${esc(r.ID)}${r.ProjectType ? ' · ' + esc(r.ProjectType) : ''}${r.SystemKW ? ' · ' + esc(r.SystemKW) + ' kW' : ''}</div>
          <div class="client">${esc(r.Client)}</div></div>
        <div class="due ${u}">${esc(due)}<small>${esc(fmtDate(r.Deadline))}</small></div>
      </div>
      <div class="meta">
        <span class="pill p-${esc(r.Priority)}">${esc(r.Priority)}</span>
        <span class="pill s-${esc(st)}">${esc(r.Status)}</span>
        ${String(r.Deliverables || '').split(',').filter(Boolean).map(d => `<span class="pill">${esc(d.trim())}</span>`).join('')}
        <span class="who ${r.AssignedTo || CLOSED.includes(r.Status) ? '' : 'none'}" style="margin-left:auto">${r.AssignedTo ? '✎ ' + esc(r.AssignedTo) : CLOSED.includes(r.Status) ? '' : 'Not assigned'}</span>
      </div></div>`;
  }).join('') : `<div class="empty">${S.requests.length ? 'Nothing here.' : 'No design requests yet.' + (S.user.role !== 'designer' ? '<br>Tap “New request” to add the first one.' : '')}</div>`;
  $('#list').querySelectorAll('.card').forEach(c => { c.onclick = () => openDetail(c.dataset.id); c.onkeydown = e => { if (e.key === 'Enter') openDetail(c.dataset.id); }; });
}

function closeModal(){ $('#modal').classList.add('hidden'); S.open = null; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });

function prioPicker(val, disabled){

function delivPicker(val, disabled){

function requestFields(r, canEdit){

/* ---------------- detail ---------------- */
async function openDetail(id){
  const r = S.requests.find(x => x.ID === id); if (!r) return;
  S.open = id;
  const role = S.user.role;
  const isSales = role === 'sales', isLead = role === 'lead', isAssignee = role === 'designer' && r.AssignedTo === S.user.name;
  const u = urgency(r);
  const designers = S.team.filter(m => m.team.toLowerCase() === 'design');
  const statusOpts = isLead ? STATUSES : isAssignee ? ['Assigned','In Progress','Info Needed','Review','Completed'] : isSales ? [r.Status,'On Hold','Cancelled','New'].filter((v,i,a) => a.indexOf(v) === i) : [r.Status];
  if (!statusOpts.includes(r.Status)) statusOpts.unshift(r.Status);
  const canStatus = isLead || isAssignee || isSales;
  const banner = u === 'overdue' ? `<div class="banner overdue">⚠ ${esc(relDue(r))} — deadline was ${esc(fmtDate(r.Deadline))}</div>`
              : u === 'urgent' ? `<div class="banner urgent">⏰ ${esc(relDue(r))}</div>`
              : u === 'soon' ? `<div class="banner soon">⏳ ${esc(relDue(r))}</div>` : '';

  openModal(`<button class="close" onclick="closeModal()" aria-label="Close">×</button>
    <h2>${esc(r.Client)}</h2>
    <div class="sub">${esc(r.ID)} · requested by ${esc(r.CreatedBy)} · ${esc(fmtDate(r.Created))}</div>
    ${banner}
    <h3 style="font-size:14px;margin:0;color:var(--navy)">Request (Sales)</h3>
    ${requestFields(r, isSales)}
    ${isSales ? '' : '<div class="lock">🔒 Deadline, priority and request details are set by the Sales team.</div>'}

    <div class="section"><h3>Design</h3>
      <div class="grid2">
        <div><label for="f-AssignedTo">Assigned designer</label>
          <select id="f-AssignedTo" ${isLead ? '' : 'disabled'}><option value="">— Not assigned —</option>
          ${designers.concat(r.AssignedTo && !designers.some(m => m.name === r.AssignedTo) ? [{ name:r.AssignedTo }] : []).map(m => `<option ${m.name === r.AssignedTo ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></div>
        <div><label for="f-Status">Status</label>
          <select id="f-Status" ${canStatus ? '' : 'disabled'}>${statusOpts.map(s => `<option ${s === r.Status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <label for="f-DesignNotes">Design notes ${isLead || isAssignee ? '' : '(design team)'}</label>
      <textarea id="f-DesignNotes" ${isLead || isAssignee ? '' : 'disabled'} placeholder="Progress, questions for sales, file location…">${esc(r.DesignNotes)}</textarea>
      ${r.AssignedAt ? `<div class="lock">Assigned ${esc(fmtDate(r.AssignedAt))}${r.CompletedAt ? ' · completed ' + esc(fmtDate(r.CompletedAt)) : ''}</div>` : ''}
    </div>
    <div class="actions"><button class="btn alt" onclick="closeModal()">Close</button><button class="btn" id="saveBtn">Save changes</button></div>

    <div class="section"><h3>Activity &amp; comments</h3>
      <div class="comment"><input type="text" id="cmt" placeholder="Write a comment (other team gets a push)…" maxlength="1000"><button class="btn" id="cmtBtn">Send</button></div>
      <ul class="log" id="log"><li><span class="spin"></span></li></ul>
    </div>`);

  $('#saveBtn').onclick = async (e) => {
    const changes = {};
    if (isSales) {
      const f = readRequestFields();
      if (!f.Client) return toast('Client / project name is required', true);
      if (!f.Deadline) return toast('Set a deadline', true);
      Object.keys(f).forEach(k => {
        const old = k === 'Deadline' ? new Date(toLocalInput(r.Deadline)).toISOString() : String(r[k] ?? '');
        if (String(f[k]) !== old) changes[k] = f[k];
      });
    }
    if (isLead && $('#f-AssignedTo').value !== (r.AssignedTo || '')) changes.AssignedTo = $('#f-AssignedTo').value;
    if (canStatus && $('#f-Status').value !== r.Status) changes.Status = $('#f-Status').value;
    if ((isLead || isAssignee) && $('#f-DesignNotes').value.trim() !== String(r.DesignNotes || '')) changes.DesignNotes = $('#f-DesignNotes').value.trim();
    if (!Object.keys(changes).length) return toast('No changes to save');
    if (changes.Status === 'Info Needed' && !(changes.DesignNotes || r.DesignNotes)) return toast('Write what info you need in Design notes', true);
    if (changes.Status === 'Cancelled' && !confirm('Cancel this design request?')) return;
    await busyBtn(e.target, async () => {
      await api('update', { id:r.ID, changes });
      toast('Saved'); await refresh(false); closeModal();
    });
  };
  const sendCmt = async () => {
    const t = $('#cmt').value.trim(); if (!t) return;
    await busyBtn($('#cmtBtn'), async () => { const log = await api('comment', { id:r.ID, text:t }); $('#cmt').value = ''; drawLog(log); });
  };
  $('#cmtBtn').onclick = sendCmt;
  $('#cmt').addEventListener('keydown', e => { if (e.key === 'Enter') sendCmt(); });
  try { drawLog(await api('log', { id:r.ID })); } catch(e){ $('#log').innerHTML = '<li>Could not load activity.</li>'; }
}
function drawLog(items){
  if (!$('#log')) return;
  $('#log').innerHTML = items.length ? items.map(l => `<li><time>${esc(fmtDate(l.time))}</time><b>${esc(l.by)}</b> ${l.action === 'Comment' ? '💬 ' : '· ' + esc(l.action) + ': '}${esc(l.detail)}</li>`).join('') : '<li>No activity yet.</li>';
}

const PDFLIB_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
const REPORT_FOOTER = {
  copyright: () => `© ${new Date().getFullYear()} Regen Renewables (Pvt) Ltd. All Rights Reserved.`,
  notice: 'This document, including all designs, drawings, specifications and technical information, is the intellectual property of Regen Renewables (Pvt) Ltd. It is confidential and may not be copied, reproduced, modified, distributed or shared with third parties without prior written consent.',
  company: 'Regen Renewables (Pvt) Ltd.   |   31/10, Castle Street, Colombo 8. 00800 Sri Lanka   |   regen.lk'
};
const R = { period:'thisMonth', from:'', to:'', designer:'', status:'all' };

function dayStart(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function ymd(d){ const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function reportRange(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  switch (R.period) {
    case 'thisMonth': return { from:new Date(y, m, 1), to:new Date(y, m + 1, 1), label:now.toLocaleString('en-GB', { month:'long', year:'numeric' }) };
    case 'lastMonth': { const f = new Date(y, m - 1, 1); return { from:f, to:new Date(y, m, 1), label:f.toLocaleString('en-GB', { month:'long', year:'numeric' }) }; }
    case 'last3': { const f = new Date(y, m - 2, 1); return { from:f, to:new Date(y, m + 1, 1), label:'' }; }
    case 'thisYear': return { from:new Date(y, 0, 1), to:new Date(y + 1, 0, 1), label:'Year ' + y };
    case 'custom': {
      const f = R.from ? dayStart(R.from + 'T00:00') : new Date(2000, 0, 1);
      const t = R.to ? new Date(dayStart(R.to + 'T00:00').getTime() + 864e5) : new Date(y + 1, 0, 1);
      return { from:f, to:t, label:'' };
    }
    default: return { from:null, to:null, label:'All requests' };
  }
}
const dShort = d => new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
function rangeText(rg){
  if (!rg.from) return 'All requests to date';
  const last = new Date(rg.to.getTime() - 1);
  return 'Requests raised ' + dShort(rg.from) + ' to ' + dShort(last) + (rg.label ? ' (' + rg.label + ')' : '');
}
function reportRows(){
  const rg = reportRange();
  return S.requests.filter(r => {
    const c = new Date(r.Created);
    if (rg.from && (c < rg.from || c >= rg.to)) return false;
    if (R.designer === '__none') { if (r.AssignedTo) return false; }
    else if (R.designer && r.AssignedTo !== R.designer) return false;
    if (R.status === 'completed' && r.Status !== 'Completed') return false;
    if (R.status === 'open' && CLOSED.includes(r.Status)) return false;
    return true;
  }).sort((a, b) => new Date(a.Created) - new Date(b.Created));
}
function spanText(ms){
  const a = Math.abs(ms), d = Math.floor(a / 864e5), h = Math.floor(a % 864e5 / 36e5);
  return d ? `${d}d ${h}h` : h ? `${h}h` : `${Math.max(1, Math.round(a / 6e4))}m`;
}
function jobResult(r, now = Date.now()){
  const dl = new Date(r.Deadline).getTime();
  if (r.Status === 'Completed') {
    const c = new Date(r.CompletedAt || r.UpdatedAt).getTime();
    return c <= dl ? { text:'On time', kind:'ok', onTime:true, days:(c - new Date(r.Created)) / 864e5 }
                   : { text:'Late ' + spanText(c - dl), kind:'late', onTime:false, days:(c - new Date(r.Created)) / 864e5 };
  }
  if (r.Status === 'Cancelled') return { text:'Cancelled', kind:'muted' };
  if (r.Status === 'On Hold') return { text:'On hold', kind:'muted', open:true, overdue: now > dl };
  return now > dl ? { text:'Overdue ' + spanText(now - dl), kind:'bad', open:true, overdue:true }
                  : { text:'Due in ' + spanText(dl - now), kind:'', open:true, overdue:false };
}
function statsOf(rows){
  const s = { total:rows.length, completed:0, onTime:0, late:0, open:0, overdue:0, cancelled:0, days:[] };
  rows.forEach(r => {
    const x = jobResult(r);
    if (r.Status === 'Cancelled') s.cancelled++;
    else if (r.Status === 'Completed') { s.completed++; x.onTime ? s.onTime++ : s.late++; s.days.push(x.days); }
    else { s.open++; if (x.overdue) s.overdue++; }
  });
  s.rate = s.completed ? Math.round(s.onTime / s.completed * 100) : null;
  s.avg = s.days.length ? s.days.reduce((a, b) => a + b, 0) / s.days.length : null;
  return s;
}
const fmtAvg = v => v == null ? '-' : v < 1 ? (v * 24).toFixed(1) + ' h' : v.toFixed(1) + ' d';

function openReport(){
  const designers = [...new Set(S.team.filter(m => m.team.toLowerCase() === 'design').map(m => m.name).concat(S.requests.map(r => r.AssignedTo).filter(Boolean)))].sort();

    <div class="grid2 ${R.period === 'custom' ? '' : 'hidden'}" id="r-custom">

      <div><label for="r-to">To</label><input id="r-to" type="date" value="${esc(R.to)}"></div>
    </div>
    <div class="grid2">

        <select id="r-designer"><option value="">All designers</option>${designers.map(n => `<option>${esc(n)}</option>`).join('')}<option value="__none">Not assigned</option></select></div>
      <div><label for="r-status">Jobs</label>
        <select id="r-status"><option value="all">All jobs</option><option value="completed">Completed only</option><option value="open">Open only</option></select></div>
    </div>
    <div class="rep-stats" id="r-preview"></div>
    <div class="actions">
      <button class="btn accent" id="r-pdf">Download PDF</button>
      ${canShare ? '<button class="btn" id="r-share">Share PDF</button>' : ''}
      <button class="btn alt" id="r-csv">Excel (CSV)</button>
    </div>`);
  $('#r-period').value = R.period; $('#r-designer').value = R.designer; $('#r-status').value = R.status;
  const sync = () => {

      .map(([v, l]) => `<div><b>${esc(v)}</b><span>${l}</span></div>`).join('');
    ['r-pdf', 'r-share', 'r-csv'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = !s.total; });
  };
  ['r-period', 'r-from', 'r-to', 'r-designer', 'r-status'].forEach(id => $('#' + id).addEventListener('change', sync));
  sync();
  $('#r-pdf').onclick = e => busyBtn(e.currentTarget, async () => { const f = await buildReportPdf(); saveBlob(f.blob, f.name); toast('Report downloaded'); });
  if ($('#r-share')) $('#r-share').onclick = e => busyBtn(e.currentTarget, async () => {
    const f = await buildReportPdf();
    try { await navigator.share({ files:[new File([f.blob], f.name, { type:'application/pdf' })], title:'Design Request Report' }); }
    catch (err) { if (err.name !== 'AbortError') { saveBlob(f.blob, f.name); toast('Sharing not available — downloaded instead'); } }
  });
  $('#r-csv').onclick = e => busyBtn(e.currentTarget, async () => { await freshData(); const f = buildReportCsv(); saveBlob(f.blob, f.name); toast('Excel file downloaded'); });

async function freshData(){
  try { const d = await api('list'); S.requests = d.requests; S.team = d.team; render(); } catch (e) { /* use the list already on screen */ }
}
function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function reportFileName(ext){
  const rg = reportRange();
  const part = rg.from ? ymd(rg.from) + '_to_' + ymd(new Date(rg.to.getTime() - 1)) : 'all_to_' + ymd(new Date());
  return `Regen-Design-Report_${part}.${ext}`;
}
function filterText(){
  const bits = [];
  if (R.designer) bits.push('Designer: ' + (R.designer === '__none' ? 'Not assigned' : R.designer));
  if (R.status !== 'all') bits.push(R.status === 'completed' ? 'Completed jobs only' : 'Open jobs only');
  return bits.join('  |  ');
}

/* ---------- Excel (CSV) ---------- */
function buildReportCsv(){
  const rows = reportRows();
  const dt = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : ymd(d) + ' ' + d.toTimeString().slice(0, 5); };
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const head = ['ID','Requested on','Requested by','Client / project','Location','System kW','Project type','Outputs','Priority','Deadline','Assigned to','Assigned on','Status','Completed on','Result','Days to complete','Sales notes','Design notes'];
  const lines = [head.map(cell).join(',')];
  rows.forEach(r => {
    const x = jobResult(r);
    lines.push([r.ID, dt(r.Created), r.CreatedBy, r.Client, r.Location, r.SystemKW, r.ProjectType, r.Deliverables, r.Priority, dt(r.Deadline),
      r.AssignedTo, dt(r.AssignedAt), r.Status, dt(r.CompletedAt), x.text, x.days != null ? x.days.toFixed(1) : '', r.SalesNotes, r.DesignNotes].map(cell).join(','));
  });
  return { blob:new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }), name:reportFileName('csv') };
}

/* ---------- PDF ---------- */
let pdfLibP;
function loadPdfLib(){
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  return pdfLibP = pdfLibP || new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFLIB_URL; s.async = true;
    s.onload = () => window.PDFLib ? res(window.PDFLib) : rej(new Error('PDF tool failed to load'));
    s.onerror = () => { pdfLibP = null; rej(new Error('Could not load the PDF tool — check your internet connection')); };
    document.head.appendChild(s);
  });
}
// Standard PDF fonts only cover Western characters: swap the common symbols, replace anything else with "?"
function pdfSafe(s){
  return String(s ?? '').replace(/[\r\n\t]+/g, ' ').replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/→/g, '->').replace(/✎/g, '')
    .replace(/[^\x20-\x7e\xa0-\xff–—‘’“”•…€™]/g, '?');
}

async function buildReportPdf(){
  const [lib] = await Promise.all([loadPdfLib(), freshData()]);
  const rows = reportRows();
  if (!rows.length) throw new Error('No jobs in this report');
  const { PDFDocument, StandardFonts, rgb } = lib;
  const doc = await PDFDocument.create();
  doc.setTitle('Regen Design Request Report'); doc.setAuthor('Regen Renewables (Pvt) Ltd.'); doc.setCreator('Regen Design Requests app');
  const F = await doc.embedFont(StandardFonts.Helvetica), FB = await doc.embedFont(StandardFonts.HelveticaBold);
  let logo = null;
  try { logo = await doc.embedPng(await (await fetch('regen-logo.png')).arrayBuffer()); } catch (e) { /* report without logo */ }

  const C = { ink:rgb(.094,.125,.184), muted:rgb(.4,.44,.52), line:rgb(.84,.86,.9), navy:rgb(.086,.129,.227), zebra:rgb(.965,.97,.98),
    green:rgb(.024,.463,.278), red:rgb(.85,.176,.125), orange:rgb(.91,.35,.047), amber:rgb(.71,.28,.03), white:rgb(1,1,1), tile:rgb(.95,.955,.965), blue:rgb(.09,.36,.83) };
  const W = 841.89, H = 595.28, M = 28, CW = W - 2 * M;
  const tw = (t, f, s) => f.widthOfTextAtSize(pdfSafe(t), s);
  function wrap(text, f, s, maxW, maxLines = 99){
    const words = pdfSafe(text).split(/\s+/).filter(Boolean), out = []; let cur = '';
    const push = w => { // break a single over-long word
      while (tw(w, f, s) > maxW && w.length > 1) { let i = w.length; while (i > 1 && tw(w.slice(0, i), f, s) > maxW) i--; out.push(w.slice(0, i)); w = w.slice(i); }
      return w;
    };
    words.forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (tw(t, f, s) <= maxW) cur = t; else { if (cur) out.push(cur); cur = push(w); }
    });
    if (cur) out.push(cur);
    if (out.length > maxLines) { const keep = out.slice(0, maxLines); let last = keep[maxLines - 1] + '…'; while (tw(last, f, s) > maxW && last.length > 2) last = last.slice(0, -2) + '…'; keep[maxLines - 1] = last; return keep; }
    return out.length ? out : [''];
  }

  // footer geometry (measured, so nothing in the body can overlap it)
  const FS = 6.6, FLH = 8.2;
  const noticeLines = wrap(REPORT_FOOTER.notice, F, FS, CW);
  const footerLines = 1 + noticeLines.length + 1;
  const FOOT_TOP = M + (footerLines - 1) * FLH + FS + 6;   // y of the rule above the footer
  const BOTTOM = FOOT_TOP + 8;                              // lowest y body content may use

  const rg = reportRange(), period = rangeText(rg), filt = filterText();
  const generated = 'Generated ' + new Date().toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true }) + ' by ' + S.user.name;
  const pages = []; let page, y;
  const text = (t, x, yy, f = F, s = 8, color = C.ink) => page.drawText(pdfSafe(t), { x, y:yy, size:s, font:f, color });
  function newPage(first){
    page = doc.addPage([W, H]); pages.push(page);
    if (first) {
      let x = M;
      if (logo) { const lh = 52, lw = logo.width / logo.height * lh; page.drawImage(logo, { x:M, y:H - M - lh, width:lw, height:lh }); x = M + lw + 14; }
      text('Design Request Report', x, H - M - 18, FB, 18, C.navy);
      text('Regen Renewables (Pvt) Ltd.  |  Design team job tracker', x, H - M - 31, F, 8.5, C.muted);
      text(period, x, H - M - 44, FB, 9);
      if (filt) text(filt, x, H - M - 55, F, 8, C.ink);
      text(generated, W - M - tw(generated, F, 7.5), H - M - 10, F, 7.5, C.muted);
      y = H - M - 66;
    } else {
      text('Design Request Report', M, H - M - 9, FB, 9, C.navy);
      text(period, M + tw('Design Request Report', FB, 9) + 10, H - M - 9, F, 8, C.muted);
      y = H - M - 16;
    }
    page.drawLine({ start:{ x:M, y }, end:{ x:W - M, y }, thickness:.8, color:C.line });
    y -= 14;
  }
  const ensure = h => { if (y - h < BOTTOM) newPage(false); };
  function heading(t){ ensure(40); text(t, M, y - 10, FB, 11, C.navy); y -= 18; }

  // table: cols [{h, w, align}], cells are strings or {t, color, bold}
  function table(cols, body, opt = {}){
    const fs = opt.size || 7.6, lh = fs + 2.4, pad = 4;
    const drawHead = () => {
      const hh = 16;
      page.drawRectangle({ x:M, y:y - hh, width:CW, height:hh, color:C.navy });
      let x = M; cols.forEach(c => {
        const t = pdfSafe(c.h), w = tw(t, FB, 7.2);
        text(t, c.align === 'right' ? x + c.w - pad - w : c.align === 'center' ? x + (c.w - w) / 2 : x + pad, y - 11, FB, 7.2, C.white); x += c.w;
      });
      y -= hh;
    };
    ensure(16 + lh + 2 * pad); drawHead();
    body.forEach((row, ri) => {
      const cells = row.map((v, i) => { const o = typeof v === 'object' && v ? v : { t:v }; const f = o.bold ? FB : F;
        return { ...o, f, lines:wrap(o.t == null || o.t === '' ? '-' : o.t, f, fs, cols[i].w - 2 * pad, opt.maxLines || 3) }; });
      const rh = Math.max(...cells.map(c => c.lines.length)) * lh + 2 * pad - 2.4;
      if (y - rh < BOTTOM) { newPage(false); drawHead(); }
      if (ri % 2) page.drawRectangle({ x:M, y:y - rh, width:CW, height:rh, color:C.zebra });
      let x = M;
      cells.forEach((c, i) => {
        c.lines.forEach((ln, li) => {
          const w = tw(ln, c.f, fs), col = cols[i];
          const xx = col.align === 'right' ? x + col.w - pad - w : col.align === 'center' ? x + (col.w - w) / 2 : x + pad;
          text(ln, xx, y - pad - fs + 1 - li * lh, c.f, fs, c.color || C.ink);
        });
        x += cols[i].w;
      });
      page.drawLine({ start:{ x:M, y:y - rh }, end:{ x:W - M, y:y - rh }, thickness:.4, color:C.line });
      y -= rh;
    });
    y -= 14;
  }

  newPage(true);

  // ---- summary tiles
  const s = statsOf(rows);
  const tiles = [
    [s.total, 'Total requests', C.ink], [s.completed, 'Completed', C.green], [s.onTime, 'Completed on time', C.green], [s.late, 'Completed late', s.late ? C.orange : C.ink],
    [s.rate == null ? '-' : s.rate + '%', 'On-time rate', s.rate == null ? C.ink : s.rate >= 80 ? C.green : s.rate >= 50 ? C.amber : C.red],
    [s.open, 'Still open', C.ink], [s.overdue, 'Open & overdue', s.overdue ? C.red : C.ink], [fmtAvg(s.avg), 'Avg time to complete', C.ink]
  ];
  heading('Summary');
  const gap = 6, tW = (CW - gap * (tiles.length - 1)) / tiles.length, tH = 42;
  tiles.forEach(([v, l, col], i) => {
    const x = M + i * (tW + gap);
    page.drawRectangle({ x, y:y - tH, width:tW, height:tH, color:C.tile });
    text(String(v), x + 8, y - 20, FB, 16, col);
    text(l, x + 8, y - 34, F, 7.2, C.muted);
  });
  y -= tH + 8;
  if (s.cancelled) { text(`${s.cancelled} cancelled request${s.cancelled > 1 ? 's are' : ' is'} listed but not counted in the on-time figures.`, M, y - 8, F, 7.5, C.muted); y -= 14; }
  y -= 8;

  // ---- designer performance
  const by = (key) => { const m = new Map(); rows.forEach(r => { const k = r[key] || ''; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return m; };
  const rateCell = st => st.rate == null ? '-' : { t:st.rate + '%', bold:true, color: st.rate >= 80 ? C.green : st.rate >= 50 ? C.amber : C.red };
  heading('Designer performance');
  const dRows = [...by('AssignedTo')].sort((a, b) => (a[0] ? 0 : 1) - (b[0] ? 0 : 1) || b[1].length - a[1].length).map(([name, list]) => {
    const st = statsOf(list);
    return [{ t:name || 'Not assigned', bold:!!name, color:name ? C.ink : C.red }, st.total, st.completed, st.onTime, st.late || '0',
      st.open, st.overdue ? { t:st.overdue, bold:true, color:C.red } : '0', rateCell(st), fmtAvg(st.avg)];
  });
  const dCols = [{ h:'Designer', w:186 }, { h:'Jobs', w:70, align:'right' }, { h:'Completed', w:76, align:'right' }, { h:'On time', w:70, align:'right' },
    { h:'Late', w:66, align:'right' }, { h:'Still open', w:70, align:'right' }, { h:'Overdue now', w:80, align:'right' }, { h:'On-time rate', w:80, align:'right' }, { h:'Avg time to complete', w:CW - 698, align:'right' }];
  table(dCols, dRows);

  // ---- requests by sales person
  heading('Requests by sales person');
  const sRows = [...by('CreatedBy')].sort((a, b) => b[1].length - a[1].length).map(([name, list]) => {
    const st = statsOf(list), urgent = list.filter(r => r.Priority === 'Urgent' || r.Priority === 'High').length;
    return [{ t:name || '-', bold:true }, st.total, urgent, st.completed, st.open, st.overdue ? { t:st.overdue, bold:true, color:C.red } : '0', st.cancelled, rateCell(st)];
  });
  table([{ h:'Sales person', w:186 }, { h:'Requests', w:80, align:'right' }, { h:'Urgent / High', w:90, align:'right' }, { h:'Completed', w:86, align:'right' },
    { h:'Still open', w:86, align:'right' }, { h:'Overdue now', w:86, align:'right' }, { h:'Cancelled', w:86, align:'right' }, { h:'On-time rate', w:CW - 700, align:'right' }], sRows);

  // ---- full job list
  heading(`Job list (${rows.length})`);
  const dts = v => v ? new Date(v).toLocaleString('en-GB', { day:'numeric', month:'short', year:'2-digit', hour:'numeric', minute:'2-digit', hour12:true }) : '';
  const prioColor = { Urgent:C.red, High:C.orange, Normal:C.blue, Low:C.muted };
  const kindColor = { ok:C.green, late:C.orange, bad:C.red, muted:C.muted };
  const jRows = rows.map(r => {
    const x = jobResult(r);
    return [{ t:r.ID, bold:true }, [r.Client, r.Location].filter(Boolean).join(' - '), [r.ProjectType, r.SystemKW ? r.SystemKW + ' kW' : ''].filter(Boolean).join(', '),
      r.Deliverables, { t:r.Priority, bold:r.Priority === 'Urgent' || r.Priority === 'High', color:prioColor[r.Priority] },
      dts(r.Created) + (r.CreatedBy ? ' - ' + r.CreatedBy : ''), dts(r.Deadline), r.AssignedTo ? r.AssignedTo : { t:'Not assigned', color:C.red },
      r.Status, dts(r.CompletedAt), { t:x.text, bold:x.kind === 'bad' || x.kind === 'late' || x.kind === 'ok', color:kindColor[x.kind] || C.ink }];
  });
  table([{ h:'ID', w:44 }, { h:'Client / location', w:142 }, { h:'Type / size', w:78 }, { h:'Outputs', w:96 }, { h:'Priority', w:44 },
    { h:'Requested', w:84 }, { h:'Deadline', w:66 }, { h:'Designer', w:62 }, { h:'Status', w:52 }, { h:'Completed', w:62 }, { h:'Result', w:CW - 730 }], jRows, { size:7.2 });

  // ---- footer on every page
  const total = pages.length;
  pages.forEach((p, i) => {
    page = p;
    p.drawLine({ start:{ x:M, y:FOOT_TOP }, end:{ x:W - M, y:FOOT_TOP }, thickness:.6, color:C.line });
    let fy = FOOT_TOP - 6 - FS;
    text(REPORT_FOOTER.copyright(), M, fy, FB, FS, C.muted);
    const pg = `Page ${i + 1} of ${total}`; text(pg, W - M - tw(pg, F, FS), fy, F, FS, C.muted);
    noticeLines.forEach(l => { fy -= FLH; text(l, M, fy, F, FS, C.muted); });
    fy -= FLH; text(REPORT_FOOTER.company, M, fy, FB, FS, C.muted);
  });

  const bytes = await doc.save();
  return { blob:new Blob([bytes], { type:'application/pdf' }), name:reportFileName('pdf'), pages:total, rows:rows.length };
}

async function busyBtn(btn, fn){
  const t = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try { await fn(); } catch(e){ toast(e.message, true); } finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = t; } }
}
let toastT;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3200); }

/* =========================================================
   DEMO MODE — runs on this device only, with sample data
   ========================================================= */
const Demo = (() => {
  const K = 'regen-drt-demo';
  const team = [
    { name:'Uditha', team:'Design', lead:true }, { name:'Nimal', team:'Design', lead:false }, { name:'Sachini', team:'Design', lead:false },
    { name:'Kavish', team:'Sales', lead:false }, { name:'Dilan', team:'Sales', lead:false }
  ];
  const H = 36e5, now = () => new Date().toISOString();
  function seed(){
    const t = Date.now(), at = h => new Date(t + h * H).toISOString();
    const rows = [
      ['DR-0001','Kavish','JJ Mills – Factory roof','Biyagama','150','Industrial','Roof layout, SLD, Structure, BOQ','Urgent',at(-5),'Client wants 3 phase, check transformer capacity.','Nimal','In Progress'],
      ['DR-0002','Dilan','Perera residence','Kandy','10','Domestic hybrid','Roof layout, SLD, BOQ','High',at(18),'Hybrid with 10 kWh battery.','Sachini','Assigned'],
      ['DR-0003','Kavish','St. Mary\'s School','Negombo','40','Commercial','Roof layout, Proposal','Normal',at(40),'Two buildings, asbestos roof on hall.','','New'],
      ['DR-0004','Dilan','Fernando house','Moratuwa','5','Domestic on-grid','Roof layout, SLD','Normal',at(120),'','Nimal','Info Needed'],
      ['DR-0005','Kavish','Green Tea Factory','Nuwara Eliya','100','Industrial','Roof layout, SLD, Structure, BOQ, Yield report','High',at(-30),'','Sachini','Completed']
    ];
    const req = rows.map(r => ({ ID:r[0], Created:at(-72), CreatedBy:r[1], Client:r[2], Location:r[3], SystemKW:r[4], ProjectType:r[5], Deliverables:r[6], Priority:r[7], Deadline:r[8], SalesNotes:r[9],
      AssignedTo:r[10], AssignedAt:r[10] ? at(-48) : '', Status:r[11], DesignNotes:r[11] === 'Info Needed' ? 'Need roof photos and CEB account number.' : '', CompletedAt:r[11] === 'Completed' ? at(-34) : '', UpdatedAt:at(-2), UpdatedBy:'Uditha', AlertStage:'' }));
    const log = req.map(r => ({ id:r.ID, time:r.Created, by:r.CreatedBy, action:'Created', detail:r.Priority + ' · due ' + fmtDate(r.Deadline) }));
    return { req, log };
  }
  const load = () => { try { return JSON.parse(localStorage.getItem(K)) || seed(); } catch(e){ return seed(); } };
  const save = d => { try { localStorage.setItem(K, JSON.stringify(d)); } catch(e){} };
  function call(action, data, user){
    const d = load(); let out;
    const lg = (id, action, detail) => d.log.push({ id, time:now(), by:user.name, action, detail });
    if (action === 'list') out = { requests:d.req, team, now:now() };
    else if (action === 'log') out = d.log.filter(l => l.id === data.id).slice().reverse();
    else if (action === 'comment') { lg(data.id, 'Comment', data.text); out = d.log.filter(l => l.id === data.id).slice().reverse(); }
    else if (action === 'create') {
      const n = Math.max(0, ...d.req.map(r => +r.ID.slice(3))) + 1;
      out = Object.assign({ ID:'DR-' + String(n).padStart(4,'0'), Created:now(), CreatedBy:user.name, AssignedTo:'', AssignedAt:'', Status:'New', DesignNotes:'', CompletedAt:'', UpdatedAt:now(), UpdatedBy:user.name, AlertStage:'' }, data.request);
      d.req.push(out); lg(out.ID, 'Created', out.Priority + ' · due ' + fmtDate(out.Deadline));
    } else if (action === 'update') {
      const r = d.req.find(x => x.ID === data.id), c = data.changes, notes = [];
      Object.keys(c).forEach(k => {
        if (k === 'AssignedTo') { r.AssignedAt = c[k] ? now() : ''; if (c[k] && r.Status === 'New') r.Status = 'Assigned'; notes.push(c[k] ? 'Assigned to ' + c[k] : 'Unassigned'); }
        else if (k === 'Status') { r.CompletedAt = c[k] === 'Completed' ? now() : ''; notes.push('Status → ' + c[k]); }
        else notes.push(k === 'Deadline' ? 'Deadline → ' + fmtDate(c[k]) : k === 'Priority' ? 'Priority → ' + c[k] : k + ' updated');
        r[k] = c[k];
      });
      r.UpdatedAt = now(); r.UpdatedBy = user.name; lg(r.ID, 'Updated', notes.join('; ')); out = r;
    } else if (action === 'login') out = user;
    save(d);
    return new Promise(res => setTimeout(() => res(JSON.parse(JSON.stringify(out))), 150));
  }
  return { call, team, reset: () => localStorage.removeItem(K) };
})();

  showApp(); await refresh(true);
}
